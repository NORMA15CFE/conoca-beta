<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONOCA - Inicio de Sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(rgba(0, 104, 55, 0.7), rgba(0, 77, 40, 0.8)), url('https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .login-card {
            background: white; padding: 40px 30px; border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 400px; max-width: 90%; text-align: center;
        }
        .logo-container img { max-width: 160px; height: auto; display: block; margin: 0 auto 10px auto; }
        .login-card h2 { color: #006837; font-size: 24px; margin-bottom: 5px; }
        .login-card p { color: #666; font-size: 13px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 13px; color: #333; }
        .form-group select, .form-group input {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none;
        }
        .form-group select:focus, .form-group input:focus { border-color: #006837; }
        .btn-ingresar {
            background-color: #006837; color: white; border: none; width: 100%; padding: 12px;
            border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .btn-ingresar:hover { background-color: #004d28; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='CONCA.jpg') }}" alt="Logo CONOCA">
        </div>
        <p>Sistema de Control y Acreditación</p>
        <form id="formLogin">
            <div class="form-group">
                <label for="zonaSelect">Seleccione su Zona / Oficina:</label>
                <select id="zonaSelect" required>
                    <option value="" disabled selected>-- Elija una opción --</option>
                    <option value="DJ000">Oficinas Divisionales (Administrador)</option>
                    <option value="DJ010">Poza Rica</option>
                    <option value="DJ020">Xalapa</option>
                    <option value="DJ030">Teziutlán</option>
                    <option value="DJ060">Veracruz</option>
                    <option value="DJ070">Papaloapan</option>
                    <option value="DJ100">Los Tuxtlas</option>
                    <option value="DJ110">Coatzacoalcos</option>
                    <option value="DJ130">Orizaba</option>
                    <option value="DJ140">Córdoba</option>
                </select>
            </div>
            <div class="form-group">
                <label for="passwordInput">Contraseña (Clave de Zona):</label>
                <input type="password" id="passwordInput" placeholder="Ingrese su clave de zona" required>
            </div>
            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const zona = document.getElementById('zonaSelect').value;
            const pass = document.getElementById('passwordInput').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ zona, pass })
            });
            const result = await response.json();

            if (result.success) {
                window.location.href = '/dashboard.html';
            } else {
                alert('¡Contraseña incorrecta! Verifique su clave de zona.');
            }
        });
    </script>
</body>
</html>
